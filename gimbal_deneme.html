<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="stand-surum" content="Gimbal deneme · 25 Kas 20:15">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gimbal deneme (Hohem V3)</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;touch-action:manipulation}
  main{max-width:520px;margin:0 auto;padding:12px}
  h1{font-size:18px;margin:4px 0 2px}
  .surum{font-size:12px;color:#888;margin-bottom:10px}
  button{font:inherit;border:0;border-radius:12px;background:#2a2a2a;color:#eee;padding:12px}
  button:active,button.basili{background:#e8501e;color:#fff}
  button:disabled{opacity:.4}
  .satir{display:flex;gap:8px;margin:8px 0;align-items:center}
  .satir>*{flex:1}
  #durum{padding:8px 10px;border-radius:10px;background:#222;font-size:14px}
  .yon{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(3,84px);gap:8px;margin:12px 0}
  .yon button{font-size:30px;touch-action:none}
  #hamTekrar{touch-action:none}
  #dur{grid-column:2;grid-row:2;font-size:15px;background:#5a1a1a}
  #yukari{grid-column:2;grid-row:1}#sol{grid-column:1;grid-row:2}#sag{grid-column:3;grid-row:2}#asagi{grid-column:2;grid-row:3}
  label{font-size:14px;color:#bbb}
  input[type=range]{width:100%}
  input[type=text]{width:100%;font:13px monospace;padding:10px;border-radius:10px;border:1px solid #444;background:#1b1b1b;color:#eee;-webkit-user-select:text;user-select:text}
  #bilgi{font-size:14px;background:#1b1b1b;border-radius:10px;padding:8px 10px;line-height:1.5}
  #kayit{font:11px/1.35 monospace;background:#0b0b0b;border-radius:10px;padding:8px;height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
  .k-giden{color:#8ab4ff}.k-gelen{color:#9be39b}.k-not{color:#ffd27a}.k-hata{color:#ff7a7a}
  details{margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Gimbal deneme · Hohem V3</h1>
  <div class="surum" id="surumDamga">Gimbal deneme · 25 Kas 20:15</div>

  <div class="satir">
    <button id="baglan">Bağlan</button>
    <button id="kes" disabled>Bağlantıyı kes</button>
  </div>
  <div id="durum">Bağlı değil. Önce Hohem Joy'u kapatın (Force stop).</div>

  <div class="yon">
    <button id="yukari" disabled>▲</button>
    <button id="sol" disabled>◀</button>
    <button id="dur" disabled>Hepsini<br>durdur</button>
    <button id="sag" disabled>▶</button>
    <button id="asagi" disabled>▼</button>
  </div>

  <div class="satir">
    <button id="otoDeneme" disabled>Otomatik deneme: 3 sn sağ → 3 sn sol → 2 sn yukarı → 2 sn aşağı</button>
  </div>

  <label for="sapma">Sapma (büyüdükçe hızlanıyor mu?): <b id="sapmaYazi">150</b></label>
  <input type="range" id="sapma" min="20" max="400" step="10" value="150">

  <div class="satir">
    <label><input type="checkbox" id="tersYatay"> Yatay yönü ters çevir</label>
    <label><input type="checkbox" id="tersDikey"> Dikey yönü ters çevir</label>
  </div>

  <div id="bilgi">Pil (ham): <b id="pil">—</b> · Gelen paket: <b id="gelenSay">0</b> · Giden: <b id="gidenSay">0</b></div>

  <details>
    <summary>Ham paket gönder (deneme için)</summary>
    <div class="satir"><input type="text" id="ham" placeholder="AA55... (boşluk olabilir)"></div>
    <div class="satir">
      <button id="hamGonder" disabled>Bir kez gönder</button>
      <button id="hamTekrar" disabled>Basılıyken 30/sn</button>
    </div>
  </details>

  <div class="satir">
    <label><input type="checkbox" id="kalpGoster"> "Buradayım" paketlerini de yaz</label>
    <button id="kopyala" style="flex:0 0 auto">Kaydı kopyala</button>
    <button id="temizle" style="flex:0 0 auto">Kaydı temizle</button>
  </div>
  <div id="kayit"></div>
</main>

<script>
var SAYFA_SURUM = "Gimbal deneme · 25 Kas 20:15";

// ---------- Paket yapisi ----------
// AA 55 | uzunluk | 00 | grup | komut | veri... | toplam | FF
// uzunluk = paketin toplam boyu - 2 ; toplam = uzunluktan veri sonuna kadar baytlarin toplami (alt 8 bit)
function paket(grup, komut, veri) {
  veri = veri || [];
  var govde = [6 + veri.length, 0x00, grup, komut].concat(veri);
  var top = 0; govde.forEach(function (b) { top = (top + b) & 0xff; });
  return new Uint8Array([0xAA, 0x55].concat(govde, [top, 0xFF]));
}
function hex(b) { return Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("").toUpperCase(); }
function hexten(s) {
  s = s.replace(/[^0-9a-fA-F]/g, "");
  if (s.length % 2) return null;
  var a = new Uint8Array(s.length / 2);
  for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
  return a;
}

// Hohem Joy'un baglaninca gonderdigi paketler (kayittan, ayni sira)
var ACILIS = [
  "AA55060000494FFF", "AA5507000034003BFF", "AA550700074A0159FF", "AA55060000353BFF",
  "AA550600075360FF", "AA55060000848AFF", "AA550600075461FF", "AA550600073542FF",
  "AA55070007340042FF", "AA55060000575DFF", "AA55070007D201E1FF", "AA550E0007C10300000000000000D9FF",
  "AA551200079A010000000000000000000000B4FF", "AA551200079A030000000000000000000000B6FF",
  "AA55120007CB000000000000000000000000E4FF", "AA551200079A090001000000000000000000BDFF",
  "AA550E0007C10300000000000000D9FF", "CC666000000000000092",
  "AA551200079A0A0502020200000000000000C8FF", "AA550800072A000039FF", "AA550600075764FF",
  "AA550600005359FF", "AA55060000545AFF", "AA55060000565CFF",
  "AA551200009A010000000000000000000000ADFF", "AA551200009A090000000000000000000000B5FF",
  "AA551200009A0A0502020200000000000000C1FF", "AA550E0000C10300000000000000D2FF",
  "AA55120000CB000000000000000000000000DDFF",
  "AA550700074A0159FF"   // kamera ekranina giris
];
var KALP = paket(0x07, 0x49);          // her saniye
var KALP10 = paket(0x07, 0x84);        // 10 saniyede bir
var TRACKER_DUR = paket(0x03, 0x2B, [0x00, 0x00]);   // uygulama takip baslarken tracker'a gonderiyor

// Yuz takibi paketi: komut 0x60, veri 01 02 03 + [x 10 bit | y 10 bit | 4 bit bos] + genislik + yukseklik + 4 x 00
function takipPaketi(x, y, w, h) {
  var v = ((x & 0x3FF) << 14) | ((y & 0x3FF) << 4);
  return paket(0x00, 0x60, [1, 2, 3, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF, w & 0xFF, h & 0xFF, 0, 0, 0, 0]);
}
var YUZ_W = 90, YUZ_H = 90;

// ---------- Kayit ----------
var kayitEl = document.getElementById("kayit");
var tumKayit = [];
function yaz(metin, tur) {
  var d = new Date();
  var s = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2) + "." + ("00" + d.getMilliseconds()).slice(-3);
  var div = document.createElement("div");
  div.className = "k-" + (tur || "not");
  div.textContent = s + " " + metin;
  tumKayit.push(s + " " + metin);
  if (tumKayit.length > 5000) tumKayit.shift();
  kayitEl.appendChild(div);
  while (kayitEl.childNodes.length > 400) kayitEl.removeChild(kayitEl.firstChild);
  kayitEl.scrollTop = kayitEl.scrollHeight;
}
function durum(m) { document.getElementById("durum").textContent = m; }

// ---------- Bluetooth ----------
var cihaz = null, yazKar = null, okuKar = null;
var mesgul = false, gidenSay = 0, gelenSay = 0;
var kalpZamanlayici = null, kalpSayac = 0;

function gonder(b, sessiz) {
  if (!yazKar) return Promise.resolve(false);
  if (mesgul) return Promise.resolve(false);   // onceki yazma bitmeden yenisini atlama
  mesgul = true;
  var p = yazKar.writeValueWithoutResponse ? yazKar.writeValueWithoutResponse(b) : yazKar.writeValue(b);
  var asim = bekle(2000).then(function () { throw new Error("2 sn içinde gönderilemedi (takıldı)"); });
  p = Promise.race([p, asim]);
  return p.then(function () {
    mesgul = false; gidenSay++;
    document.getElementById("gidenSay").textContent = gidenSay;
    if (!sessiz) yaz("→ " + hex(b), "giden");
    return true;
  }).catch(function (e) {
    mesgul = false;
    yaz("Gönderilemedi: " + e.message, "hata");
    return false;
  });
}
function bekle(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function sirayla(liste, aralik) {
  var p = Promise.resolve();
  liste.forEach(function (b) {
    p = p.then(function () { return gonderBekleyerek(b); }).then(function () { return bekle(aralik); });
  });
  return p;
}
function gonderBekleyerek(b) {   // sirali gonderimler icin: mesgulse bekleyip yeniden dener
  return gonder(b).then(function (ok) {
    if (ok || !yazKar) return ok;
    return bekle(15).then(function () { return gonderBekleyerek(b); });
  });
}

function gelen(e) {
  var v = new Uint8Array(e.target.value.buffer);
  gelenSay++;
  document.getElementById("gelenSay").textContent = gelenSay;
  var h = hex(v);
  var kalpMi = v.length > 5 && v[0] === 0xAA && v[5] === 0x49;
  if (kalpMi && v.length >= 10) {
    var pil = (v[8] << 8) | v[9];
    document.getElementById("pil").textContent = pil;
  }
  var tekrarlayan = v.length > 5 && v[0] === 0xAA && (v[5] === 0x49 || v[5] === 0x84);
  if (!tekrarlayan || document.getElementById("kalpGoster").checked) yaz("← " + h, "gelen");
}

function servisBul(sunucu) {
  return sunucu.getPrimaryServices().then(function (servisler) {
    var p = Promise.resolve();
    servisler.forEach(function (s) {
      p = p.then(function () {
        if (yazKar && okuKar) return;
        return s.getCharacteristics().then(function (kl) {
          kl.forEach(function (k) {
            if (k.uuid.indexOf("0000ffe1") === 0) yazKar = k;
            if (k.uuid.indexOf("0000ffe2") === 0) okuKar = k;
          });
        }).catch(function () {});
      });
    });
    return p;
  });
}

function baglan() {
  if (!navigator.bluetooth) { durum("Bu tarayıcıda Web Bluetooth yok. Pixel'de Chrome ile açın."); return; }
  durum("Gimbal aranıyor… listeden SV3-… olanı seçin.");
  navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: "SV3" }],
    optionalServices: [0xffe0, 0xffe1, 0xfff0, 0xff00]
  }).then(function (c) {
    cihaz = c;
    cihaz.addEventListener("gattserverdisconnected", koptu);
    durum("Bağlanılıyor: " + (c.name || "?"));
    return c.gatt.connect();
  }).then(function (sunucu) {
    return servisBul(sunucu);
  }).then(function () {
    if (!yazKar || !okuKar) throw new Error("FFE1/FFE2 bulunamadı");
    yaz("FFE1 (yazma) ve FFE2 (cevap) bulundu.");
    okuKar.addEventListener("characteristicvaluechanged", gelen);
    // Cevap kanalini acma istegi gimbalda cevapsiz kaliyor ve Chrome'un tum siradaki islemlerini kilitliyor.
    // Bu surumde hic acmiyoruz; sadece komut gonderiyoruz.
    yaz("Cevap kanalı atlandı (sadece komut gönderilecek).");
    durum("Bağlandı. Açılış paketleri gönderiliyor…");
    return sirayla(ACILIS.map(hexten), 40);
  }).then(function () {
    kalpBaslat();
    dugmeler(true);
    durum("Hazır: " + cihaz.name + ". Bir yön tuşunu basılı tutun.");
    yaz("Açılış tamam. Yön tuşunu basılı tutunca saniyede ~30 takip paketi gider.");
  }).catch(function (e) {
    durum("Bağlanamadı: " + e.message);
    yaz("Hata: " + e.message, "hata");
  });
}

function kalpBaslat() {
  kalpDurdur();
  kalpSayac = 0;
  kalpZamanlayici = setInterval(function () {
    kalpSayac++;
    if (kalpSayac % 10 === 0) gonder(KALP10, true);
    else gonder(KALP, true);
  }, 1000);
}
function kalpDurdur() { if (kalpZamanlayici) clearInterval(kalpZamanlayici); kalpZamanlayici = null; }

function koptu() {
  hareketBitir();
  kalpDurdur();
  yazKar = null; okuKar = null;
  dugmeler(false);
  durum("Bağlantı koptu. Tekrar Bağlan'a basın.");
  yaz("Bağlantı koptu.", "hata");
}
function kes() {
  hareketBitir();
  kalpDurdur();
  if (cihaz && cihaz.gatt.connected) cihaz.gatt.disconnect();
}

function dugmeler(acik) {
  ["yukari", "asagi", "sol", "sag", "dur", "hamGonder", "hamTekrar", "otoDeneme"].forEach(function (id) {
    document.getElementById(id).disabled = !acik;
  });
  document.getElementById("kes").disabled = !acik;
  document.getElementById("baglan").disabled = acik;
}

// ---------- Hareket ----------
var hareketZamanlayici = null, aktifDugme = null;
function hareketBaslat(yon, dugme) {
  hareketBitir(true);
  aktifDugme = dugme; dugme.classList.add("basili");
  var s = parseInt(document.getElementById("sapma").value, 10);
  var tx = document.getElementById("tersYatay").checked ? -1 : 1;
  var ty = document.getElementById("tersDikey").checked ? -1 : 1;
  var x = 0, y = 0;
  if (yon === "sag") x = s * tx;
  if (yon === "sol") x = -s * tx;
  if (yon === "asagi") y = s * ty;
  if (yon === "yukari") y = -s * ty;
  var p = takipPaketi(x, y, YUZ_W, YUZ_H);
  yaz("Hareket: " + yon + " (sapma " + s + ") → " + hex(p) + " · tekrar ediyor…", "giden");
  gonder(TRACKER_DUR, true);
  gonder(takipPaketi(0, 0, 0, 0), true);
  hareketZamanlayici = setInterval(function () { gonder(p, true); }, 30);
}
function hareketBitir(sessiz) {
  if (aktifDugme) aktifDugme.classList.remove("basili");
  aktifDugme = null;
  if (!hareketZamanlayici) return;
  clearInterval(hareketZamanlayici); hareketZamanlayici = null;
  // ortaya al, sonra sifir (uygulama takibi boyle bitiriyor)
  sirayla([takipPaketi(0, 0, YUZ_W, YUZ_H), takipPaketi(0, 0, YUZ_W, YUZ_H), takipPaketi(0, 0, 0, 0), takipPaketi(0, 0, 0, 0)], 30);
  if (!sessiz) yaz("Durduruldu.", "not");
}

function basiliTut(id, basla) {
  var d = document.getElementById(id);
  d.addEventListener("pointerdown", function (e) { if (d.disabled) return; e.preventDefault(); d.setPointerCapture && d.setPointerCapture(e.pointerId); basla(d); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) {
    d.addEventListener(ev, function () { if (aktifDugme === d) hareketBitir(); });
  });
  d.addEventListener("contextmenu", function (e) { e.preventDefault(); });
}
["yukari", "asagi", "sol", "sag"].forEach(function (id) {
  basiliTut(id, function (d) { hareketBaslat(id, d); });
});
basiliTut("hamTekrar", function (d) {
  var b = hexten(document.getElementById("ham").value);
  if (!b) { yaz("Ham paket geçersiz.", "hata"); return; }
  hareketBitir(true);
  aktifDugme = d; d.classList.add("basili");
  yaz("Ham tekrar: " + hex(b), "giden");
  hareketZamanlayici = setInterval(function () { gonder(b, true); }, 30);
});

// Basili tutmadan deneme: sirayla yonleri kendisi calistirir
var otoIptal = false;
document.getElementById("otoDeneme").addEventListener("click", function () {
  otoIptal = false;
  var adimlar = [["sag", 3000], ["sol", 3000], ["yukari", 2000], ["asagi", 2000]];
  var p = Promise.resolve();
  adimlar.forEach(function (a) {
    p = p.then(function () {
      if (otoIptal || !yazKar) return;
      hareketBaslat(a[0], document.getElementById(a[0]));
      return bekle(a[1]).then(function () { hareketBitir(); return bekle(1500); });
    });
  });
  p.then(function () { yaz(otoIptal ? "Otomatik deneme durduruldu." : "Otomatik deneme bitti.", "not"); });
});

document.getElementById("dur").addEventListener("click", function () { otoIptal = true; hareketBitir(); yaz("Hepsini durdur.", "not"); });
document.getElementById("baglan").addEventListener("click", baglan);
document.getElementById("kes").addEventListener("click", kes);
document.getElementById("temizle").addEventListener("click", function () { kayitEl.innerHTML = ""; tumKayit = []; });
document.getElementById("kopyala").addEventListener("click", function () {
  var bas = [
    "Sürüm: " + SAYFA_SURUM,
    "Cihaz: " + (cihaz ? cihaz.name : "-") + " · bağlı: " + (cihaz && cihaz.gatt.connected ? "evet" : "hayır"),
    "Giden: " + gidenSay + " · Gelen: " + gelenSay,
    "Tarayıcı: " + navigator.userAgent,
    "----"
  ];
  var metin = bas.concat(tumKayit).join("\n");
  function bitti() { yaz("Kayıt panoya kopyalandı (" + tumKayit.length + " satır).", "not"); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(metin).then(bitti, function () { eskiKopya(metin); bitti(); });
  } else { eskiKopya(metin); bitti(); }
});
function eskiKopya(m) {
  var t = document.createElement("textarea"); t.value = m; document.body.appendChild(t);
  t.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(t);
}
document.getElementById("hamGonder").addEventListener("click", function () {
  var b = hexten(document.getElementById("ham").value);
  if (!b) { yaz("Ham paket geçersiz.", "hata"); return; }
  gonder(b);
});
document.getElementById("sapma").addEventListener("input", function () {
  document.getElementById("sapmaYazi").textContent = this.value;
});
document.addEventListener("visibilitychange", function () { if (document.hidden) hareketBitir(); });
window.addEventListener("blur", function () { hareketBitir(); });

yaz("Sayfa hazır (" + SAYFA_SURUM + "). Hohem Joy kapalıyken Bağlan'a basın.");
</script>
</body>
</html>
